<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="负片校正工具：自动识别片基色，在本地把扫描负片还原为正片，支持曝光、对比度、白平衡等调整。图片不上传服务器。">
  <title>负片校正 - flowerdeer 小工具</title>
  <link rel="stylesheet" href="styles.css?v=1.0.0">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/tools/" aria-label="返回小工具列表">← 小工具</a>
    <span class="title">负片校正</span>
    <span class="spacer"></span>
    <a class="origin-note" href="https://lab.qingsiphotograph.com/intuitive-film/" target="_blank" rel="noopener noreferrer" title="处理思路参考 QingSi Lab 的「直观胶片」">参考来源 ↗</a>
  </header>

  <main class="layout">
    <section class="stage">
      <div class="stage-inner">
        <div id="drop-zone" class="drop-zone" tabindex="0" role="button" aria-label="选择或拖入负片扫描图">
          <div class="drop-hint">
            <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="4.5" width="18" height="15" rx="1.5"></rect>
              <path d="M7.2 4.5v15M16.8 4.5v15"></path>
              <path d="M4.6 7.2h1.2M4.6 10h1.2M4.6 12.8h1.2M4.6 15.6h1.2M4.6 17.9h1.2M18.2 7.2h1.2M18.2 10h1.2M18.2 12.8h1.2M18.2 15.6h1.2M18.2 17.9h1.2"></path>
              <path d="M10.4 13.6V9.8l3 1.9-3 1.9z" fill="currentColor" stroke="none"></path>
            </svg>
            <p class="drop-main">点击选择，或拖入负片扫描图</p>
            <p class="drop-sub">支持 JPEG / PNG / WebP / TIFF，全部在本机处理</p>
          </div>
          <input type="file" id="file-input" accept="image/jpeg,image/png,image/webp,image/tiff,.tif,.tiff" hidden>
        </div>
        <div id="canvas-wrap" class="canvas-wrap" hidden>
          <canvas id="canvas"></canvas>
          <div id="sample-badge" class="sample-badge" hidden>点击画面中未曝光的片基区域</div>
        </div>
      </div>
      <div class="stage-bar">
        <span id="status" class="status">等待载入图片</span>
        <span class="stage-actions">
          <button id="btn-compare" class="ghost-btn" disabled>按住查看原片</button>
          <button id="btn-reset" class="ghost-btn" disabled>重置参数</button>
          <button id="btn-export" class="primary-btn" disabled>导出 JPEG</button>
        </span>
      </div>
    </section>

    <aside class="panel">
      <div class="card">
        <div class="card-head">
          <h2>片基色</h2>
          <span id="base-source" class="tag">默认值</span>
        </div>
        <div class="base-row">
          <span id="base-swatch" class="base-swatch" aria-hidden="true"></span>
          <span id="base-rgb" class="base-rgb">RGB 211, 122, 78</span>
        </div>
        <div class="card-actions">
          <button id="btn-auto-base" class="ghost-btn" disabled>自动识别</button>
          <button id="btn-manual-base" class="ghost-btn" disabled>手动取样</button>
        </div>
        <p id="base-message" class="card-note">载入图片后自动识别画面边缘的未曝光片基。</p>
      </div>

      <div class="card">
        <div class="card-head">
          <h2>调整</h2>
          <span class="card-note-inline" id="adj-note">双击滑块可复位</span>
        </div>
        <div id="sliders" class="sliders"></div>
      </div>
    </aside>
  </main>

  <script src="lib/pako.min.js"></script>
  <script src="lib/UTIF.js"></script>
  <script src="app.js?v=1.0.0"></script>
</body>
</html>
